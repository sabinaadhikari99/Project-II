{% extends "base_dashboard.html" %}
{% block title %}Notifications | SkillSync AI{% endblock %}

{% block content %}
<style>
  /* ============================================================
     NOTIFICATIONS — Unified Design Tokens (matches other pages)
     ============================================================ */
  .notif-page {
    animation: sgFadeIn 0.5s ease both;
    padding-bottom: var(--sp-6);

    --accent: #2563EB;
    --accent-rgb: 37, 99, 235;
    --surface: #fff;
    --surface-alt: #f8f9fb;
    --surface-hover: #f1f3f6;
    --txt: rgba(15, 23, 42, 0.88);
    --txt-soft: rgba(15, 23, 42, 0.55);
    --txt-muted: rgba(15, 23, 42, 0.38);
    --bdr: rgba(15, 23, 42, 0.06);
    --bdr-hover: rgba(15, 23, 42, 0.12);
    --shadow: rgba(15, 23, 42, 0.04);
    --shadow-lg: rgba(15, 23, 42, 0.08);
    --track: rgba(15, 23, 42, 0.07);
    --page-bg: #F8FAFC;
    --radius: 14px;
    --radius-sm: 8px;
    --radius-pill: 999px;
    --success: #16a34a;
    --success-bg: rgba(34, 197, 94, 0.10);
    --success-bdr: rgba(34, 197, 94, 0.18);
    --warn: #d97706;
    --warn-bg: rgba(217, 119, 6, 0.10);
    --warn-bdr: rgba(217, 119, 6, 0.18);
    --danger: #dc2626;
    --danger-bg: rgba(220, 38, 38, 0.08);
    --danger-bdr: rgba(220, 38, 38, 0.14);
    --purple: #7c3aed;
    --purple-bg: rgba(124, 58, 237, 0.08);

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 28px;

    --el-1: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.05);
    --el-2: 0 2px 6px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.08);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Force brand blue on this page */
  .notif-page {
    --bs-primary: #2563EB !important;
    --bs-primary-rgb: 37, 99, 235 !important;
    --accent: #2563EB !important;
    --accent-rgb: 37, 99, 235 !important;
  }

  /* Dark theme */
  html.theme-dark .notif-page,
  [data-theme="dark"] .notif-page {
    --accent: #3B82F6 !important;
    --accent-rgb: 59, 130, 246 !important;
    --bs-primary: #3B82F6 !important;
    --bs-primary-rgb: 59, 130, 246 !important;

    --surface: #1E293B;
    --surface-alt: #172033;
    --surface-hover: #24334d;
    --txt: rgba(248, 250, 252, 0.92);
    --txt-soft: rgba(248, 250, 252, 0.62);
    --txt-muted: rgba(248, 250, 252, 0.42);
    --bdr: rgba(248, 250, 252, 0.08);
    --bdr-hover: rgba(248, 250, 252, 0.16);
    --shadow: rgba(0, 0, 0, 0.28);
    --shadow-lg: rgba(0, 0, 0, 0.42);
    --track: rgba(248, 250, 252, 0.10);
    --page-bg: #0B1120;
    --el-1: 0 1px 3px rgba(0, 0, 0, 0.24), 0 4px 12px rgba(0, 0, 0, 0.28);
    --el-2: 0 2px 6px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.38);
  }

  @keyframes sgFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    margin-bottom: var(--sp-5);
    flex-wrap: wrap;
  }
  .page-header-left {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
  }
  .page-header-left .brand-mark {
    width: 40px; height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.25);
  }
  .page-header-left .page-title {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--txt);
    line-height: 1.15;
  }
  .page-header .header-actions {
    display: flex;
    gap: var(--sp-2);
    flex-shrink: 0;
  }
  .btn-primary-soft {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    height: 40px;
    padding: 0 var(--sp-4);
    border-radius: var(--radius-pill);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.30);
    transition: all 0.3s var(--ease);
  }
  .btn-primary-soft:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(var(--accent-rgb), 0.40);
    color: #fff;
  }
  .btn-primary-soft:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Stats Grid ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
  }
  @media (max-width: 991.98px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 575.98px) { .stats-grid { grid-template-columns: 1fr 1fr; gap: var(--sp-2); } }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--bdr);
    border-radius: var(--radius);
    padding: var(--sp-3) var(--sp-4);
    transition: all 0.3s var(--ease);
    box-shadow: var(--el-1);
    animation: sgFadeIn 0.5s ease both;
  }
  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.10s; }
  .stat-card:nth-child(3) { animation-delay: 0.15s; }
  .stat-card:nth-child(4) { animation-delay: 0.20s; }

  .stat-card:hover {
    box-shadow: var(--el-2);
    border-color: var(--bdr-hover);
    transform: translateY(-2px);
  }
  .stat-card .stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--sp-2);
  }
  .stat-card .stat-icon {
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
    font-size: 0.9rem;
    border: 1px solid rgba(var(--accent-rgb), 0.08);
  }
  .stat-card .stat-badge {
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.1rem 0.55rem;
    border-radius: var(--radius-pill);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    background: var(--surface-alt);
    color: var(--txt-muted);
    border: 1px solid var(--bdr);
  }
  .stat-badge.success {
    background: var(--success-bg);
    color: var(--success);
    border-color: var(--success-bdr);
  }
  .stat-badge.warning {
    background: var(--warn-bg);
    color: var(--warn);
    border-color: var(--warn-bdr);
  }
  .stat-card .stat-value {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--txt);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .stat-card .stat-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--txt-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: var(--sp-1);
  }

  /* ── Main Panel ── */
  .main-panel {
    background: var(--surface);
    border: 1px solid var(--bdr);
    border-radius: var(--radius);
    box-shadow: var(--el-1);
    overflow: hidden;
    transition: all 0.3s var(--ease);
  }
  .main-panel:hover {
    box-shadow: var(--el-2);
    border-color: var(--bdr-hover);
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--bdr);
    background: var(--surface-alt);
  }
  .panel-header .panel-title-group {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }
  .panel-header .panel-icon {
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
    font-size: 0.75rem;
    border: 1px solid rgba(var(--accent-rgb), 0.08);
  }
  .panel-header .panel-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--txt);
    margin: 0;
  }
  .panel-header .panel-meta {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
  }
  .panel-header .unread-pill {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius-pill);
    font-size: 0.68rem;
    font-weight: 700;
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.12);
  }
  .panel-header .unread-pill .pill-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulseRing 2s ease-in-out infinite;
  }
  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.3; }
  }

  /* ── Filter Bar ── */
  .filter-bar {
    display: flex;
    gap: var(--sp-1);
    padding: var(--sp-2) var(--sp-4);
    border-bottom: 1px solid var(--bdr);
    background: var(--surface-alt);
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: var(--sp-1) var(--sp-3);
    border-radius: var(--radius-pill);
    font-size: 0.76rem;
    font-weight: 600;
    border: 1.5px solid transparent;
    background: transparent;
    color: var(--txt-soft);
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
  }
  .filter-btn:hover {
    background: rgba(var(--accent-rgb), 0.06);
    color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.25);
  }
  .filter-btn.active:hover {
    filter: brightness(1.06);
  }

  /* ── Notification List ── */
  .notification-list {
    padding: var(--sp-3) var(--sp-4);
  }
  .notification-item {
    display: flex;
    gap: var(--sp-3);
    padding: var(--sp-3);
    border-radius: var(--radius-sm);
    border: 1px solid var(--bdr);
    background: var(--surface);
    margin-bottom: var(--sp-2);
    transition: all 0.25s var(--ease);
    animation: slideInLeft 0.4s ease both;
    position: relative;
  }
  .notification-item:last-child { margin-bottom: 0; }
  .notification-item.unread {
    background: rgba(var(--accent-rgb), 0.03);
    border-color: rgba(var(--accent-rgb), 0.15);
    border-left: 3px solid var(--accent);
  }
  .notification-item:hover {
    border-color: var(--bdr-hover);
    box-shadow: var(--el-1);
    transform: translateX(4px);
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .notif-indicator {
    flex-shrink: 0;
    padding-top: 4px;
  }
  .notif-indicator .indicator-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
    transition: all 0.3s ease;
  }
  .notif-indicator .indicator-dot.read {
    background: var(--txt-muted);
    box-shadow: none;
  }

  .notif-content {
    flex: 1;
    min-width: 0;
  }
  .notif-header {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
    margin-bottom: var(--sp-1);
  }
  .notif-type-tag {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.05rem 0.55rem;
    border-radius: var(--radius-pill);
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.10);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .notif-time {
    font-size: 0.7rem;
    color: var(--txt-muted);
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    font-weight: 500;
  }
  .notif-unread-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.05rem 0.5rem;
    border-radius: var(--radius-pill);
    background: rgba(var(--accent-rgb), 0.10);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.15);
  }
  .notif-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--txt);
    margin-bottom: var(--sp-1);
    line-height: 1.4;
  }
  .notif-message {
    font-size: 0.78rem;
    color: var(--txt-soft);
    line-height: 1.6;
    margin-bottom: var(--sp-2);
  }
  .notif-meta {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
    font-size: 0.7rem;
    color: var(--txt-muted);
    font-weight: 500;
    margin-bottom: var(--sp-2);
  }
  .notif-meta .meta-divider {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--txt-muted);
    opacity: 0.3;
  }
  .notif-meta .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    padding: 0.05rem 0.5rem;
    border-radius: var(--radius-sm);
    background: rgba(var(--accent-rgb), 0.05);
    border: 1px solid rgba(var(--accent-rgb), 0.06);
    color: var(--txt-soft);
    font-size: 0.68rem;
    font-weight: 600;
  }

  .notif-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-2);
    align-items: center;
  }
  .btn-sm-primary {
    height: 32px;
    padding: 0 var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
    border: none;
    background: var(--accent);
    color: #fff;
    transition: all 0.25s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.25);
    cursor: pointer;
  }
  .btn-sm-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.35);
    color: #fff;
  }
  .btn-sm-ghost {
    height: 32px;
    padding: 0 var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid rgba(var(--accent-rgb), 0.20);
    transition: all 0.25s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    cursor: pointer;
  }
  .btn-sm-ghost:hover {
    background: rgba(var(--accent-rgb), 0.06);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .btn-sm-danger-ghost {
    height: 32px;
    padding: 0 var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
    background: transparent;
    color: var(--danger);
    border: 1.5px solid rgba(220, 38, 38, 0.20);
    transition: all 0.25s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    cursor: pointer;
  }
  .btn-sm-danger-ghost:hover {
    background: rgba(220, 38, 38, 0.06);
    border-color: var(--danger);
    transform: translateY(-1px);
  }
  .notif-read-status {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--txt-muted);
    padding: 0.1rem 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    border: 1px solid var(--bdr);
  }

  /* ── Empty State ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--sp-6) var(--sp-4);
    text-align: center;
  }
  .empty-state .empty-icon {
    width: 56px; height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent);
    font-size: 1.5rem;
    margin-bottom: var(--sp-3);
    border: 1px solid rgba(var(--accent-rgb), 0.10);
  }
  .empty-state .empty-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--txt-soft);
    margin-bottom: var(--sp-1);
  }
  .empty-state .empty-sub {
    font-size: 0.78rem;
    color: var(--txt-muted);
    max-width: 300px;
    line-height: 1.5;
  }

  /* ── Shimmer ── */
  .shimmer-item {
    padding: var(--sp-3);
    border-radius: var(--radius-sm);
    border: 1px solid var(--bdr);
    background: var(--surface);
    margin-bottom: var(--sp-2);
  }
  .shimmer-line {
    height: 10px;
    border-radius: 5px;
    background: rgba(15, 23, 42, 0.05);
    animation: sgPulse 1.4s ease-in-out infinite;
    margin-bottom: var(--sp-2);
  }
  .shimmer-line:last-child { margin-bottom: 0; }
  .shimmer-line.short { width: 30%; }
  .shimmer-line.medium { width: 55%; }
  .shimmer-line.wide { width: 75%; }
  .shimmer-line.full { width: 100%; }

  @keyframes sgPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ── Pagination ── */
  .pagination-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4);
    border-top: 1px solid var(--bdr);
    background: var(--surface-alt);
  }
  .page-btn {
    padding: var(--sp-1) var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    font-weight: 700;
    border: 1.5px solid var(--bdr);
    background: var(--surface);
    color: var(--txt-soft);
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.05);
    transform: translateY(-1px);
  }
  .page-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.25);
  }
  .page-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .page-info {
    font-size: 0.78rem;
    color: var(--txt-muted);
    padding: 0 var(--sp-2);
    font-weight: 600;
  }

  /* ── Responsive ── */
  @media (max-width: 767.98px) {
    .page-header { flex-direction: column; align-items: stretch; gap: var(--sp-3); }
    .page-header .header-actions { justify-content: flex-start; }
    .panel-header { flex-wrap: wrap; }
    .filter-bar { padding: var(--sp-2); }
    .notification-list { padding: var(--sp-2); }
    .notification-item { flex-direction: column; gap: var(--sp-2); }
    .notif-indicator { display: flex; align-items: center; gap: var(--sp-2); }
    .btn-sm-primary, .btn-sm-ghost, .btn-sm-danger-ghost { height: 36px; }
  }
  @media (max-width: 575.98px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .stat-card { padding: var(--sp-2); }
    .stat-card .stat-value { font-size: 1.2rem; }
    .notif-actions { flex-direction: column; align-items: stretch; }
    .notif-actions .btn-sm-primary,
    .notif-actions .btn-sm-ghost,
    .notif-actions .btn-sm-danger-ghost { justify-content: center; width: 100%; }
    .page-header .page-title { font-size: 1.1rem; }
  }
</style>

<div class="notif-page">

  <!-- ===== Page Header ===== -->
  <div class="page-header">
    <div class="page-header-left">
      <div class="brand-mark"><i class="bi bi-bell"></i></div>
      <h1 class="page-title">Notifications</h1>
    </div>
    <div class="header-actions">
      <button class="btn-primary-soft" type="button" onclick="markAllRead()" id="markAllReadBtn">
        <i class="bi bi-check2-all"></i> Mark All Read
      </button>
    </div>
  </div>

  <!-- ===== Stats Grid ===== -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon"><i class="bi bi-bell"></i></div>
        <span class="stat-badge success"><i class="bi bi-database"></i> All</span>
      </div>
      <div id="totalNotifications" class="stat-value">–</div>
      <div class="stat-label">Total Notifications</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon"><i class="bi bi-bell-fill"></i></div>
        <span class="stat-badge warning"><i class="bi bi-dot"></i> New</span>
      </div>
      <div id="unreadNotifications" class="stat-value">–</div>
      <div class="stat-label">Unread</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon"><i class="bi bi-stars"></i></div>
        <span class="stat-badge success"><i class="bi bi-arrow-up-short"></i> Best</span>
      </div>
      <div id="topMatchNotification" class="stat-value">–</div>
      <div class="stat-label">Top Match</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon"><i class="bi bi-tags"></i></div>
        <span class="stat-badge success"><i class="bi bi-layers"></i> Types</span>
      </div>
      <div id="typeCount" class="stat-value">–</div>
      <div class="stat-label">Categories</div>
    </div>
  </div>

  <!-- ===== Main Panel ===== -->
  <div class="main-panel">
    <!-- Panel Header -->
    <div class="panel-header">
      <div class="panel-title-group">
        <div class="panel-icon"><i class="bi bi-bell"></i></div>
        <h3 class="panel-title">All Notifications</h3>
      </div>
      <div class="panel-meta">
        <span id="unreadBadge" class="unread-pill" style="display:none!important;">
          <span class="pill-dot"></span>
          <span id="unreadBadgeText">0 unread</span>
        </span>
        <span class="unread-pill" style="background:var(--surface-alt);color:var(--txt-muted);border-color:var(--bdr);">
          <i class="bi bi-clock-history"></i>
          <span id="lastUpdated">Just now</span>
        </span>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
        <i class="bi bi-grid"></i> All
      </button>
      <button class="filter-btn" data-filter="unread" onclick="setFilter('unread')">
        <i class="bi bi-dot"></i> Unread
      </button>
    </div>

    <!-- Notification List -->
    <div class="notification-list" id="notificationsList"></div>

    <!-- Pagination -->
    <div class="pagination-bar" id="paginationBar" style="display:none">
      <button class="page-btn" id="prevPage" onclick="changePage(-1)">
        <i class="bi bi-chevron-left"></i> Prev
      </button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="nextPage" onclick="changePage(1)">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  requireRole(["job_seeker", "recruiter", "admin"]);

  // ===== Accent Color =====
  (function applyAccentColor() {
    const saved = localStorage.getItem("pref_accent");
    if (!saved) return;
    document.documentElement.style.setProperty("--bs-primary", saved);
    const temp = document.createElement("div");
    temp.style.color = saved;
    document.body.appendChild(temp);
    const rgb = getComputedStyle(temp).color;
    document.body.removeChild(temp);
    const m = rgb.match(/(\d+),\s*(\d+),\s*(\d+)/);
    if (m) document.documentElement.style.setProperty("--bs-primary-rgb", `${m[1]}, ${m[2]}, ${m[3]}`);
  })();

  // ===== State =====
  let currentPage = 1;
  let currentFilter = "all";
  let paginationData = null;

  // ===== Utilities =====
  function animateValue(id, target, suffix = "") {
    const el = document.getElementById(id);
    if (!el) return;
    if (isNaN(target)) { el.textContent = target + suffix; return; }
    const dur = 600, start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * ease) + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function timeAgo(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return "Just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
    return date.toLocaleDateString();
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function updateLastUpdated() {
    document.getElementById('lastUpdated').textContent = 'Just now';
  }

  // ===== Notification Type Helpers =====
  const TYPE_ICONS = {
    job_match: "stars",
    application: "file-earmark-text",
    interview: "calendar-check",
    ai_match: "robot",
    resume: "file-earmark-person",
    skill_gap: "graph-up-arrow",
    recruiter: "building",
    admin: "shield-check",
    profile: "person-circle",
    security: "shield-exclamation",
    system: "gear",
    message: "chat-dots",
    company: "building",
    verification: "check2-circle",
  };

  const TYPE_LABELS = {
    job_match: "Job Match",
    application: "Application",
    interview: "Interview",
    ai_match: "AI Match",
    resume: "Resume",
    skill_gap: "Skill Gap",
    recruiter: "Recruiter",
    admin: "Admin",
    profile: "Profile",
    security: "Security",
    system: "System",
    message: "Message",
    company: "Company",
    verification: "Verification",
  };

  function getTypeIcon(type) { return TYPE_ICONS[type] || "bell"; }
  function getTypeLabel(type) { return TYPE_LABELS[type] || type || "General"; }

  // ===== Render Functions =====
  function shimmerLoader(count = 4) {
    return Array.from({ length: count }, (_, i) => `
      <div class="shimmer-item" style="animation-delay:${i * 0.08}s">
        <div class="shimmer-line short"></div>
        <div class="shimmer-line medium"></div>
        <div class="shimmer-line wide"></div>
        <div class="shimmer-line full"></div>
      </div>`
    ).join("");
  }

  function emptyState(icon, title, sub) {
    return `
      <div class="empty-state">
        <div class="empty-icon"><i class="bi bi-${icon}"></i></div>
        <div class="empty-title">${title}</div>
        <div class="empty-sub">${sub}</div>
      </div>`;
  }

  function renderNotification(item, index) {
    const job = item.job || {};
    const sender = item.sender || {};
    const isUnread = !item.is_read;
    const ago = timeAgo(item.created_at);
    const fullDate = new Date(item.created_at).toLocaleString();
    const nType = item.notification_type || "system";
    const isMatch = nType === "job_match" || nType === "ai_match";

    let metaHtml = "";
    if (job.title) {
      metaHtml += `<span class="meta-chip"><i class="bi bi-briefcase"></i> ${escapeHtml(job.title)}</span>`;
    }
    if (job.company) {
      metaHtml += `<span class="meta-divider"></span>
                   <span class="meta-chip"><i class="bi bi-building"></i> ${escapeHtml(job.company)}</span>`;
    }
    if (sender.email && nType !== "system" && nType !== "admin") {
      metaHtml += `<span class="meta-divider"></span>
                   <span class="meta-chip"><i class="bi bi-person"></i> ${escapeHtml(sender.email)}</span>`;
    }

    return `
      <div class="notification-item ${isUnread ? 'unread' : ''}"
           style="animation-delay:${Math.min(index * 0.04, 0.3)}s">
        <div class="notif-indicator">
          <div class="indicator-dot ${isUnread ? '' : 'read'}"></div>
        </div>
        <div class="notif-content">
          <div class="notif-header">
            <span class="notif-type-tag">
              <i class="bi bi-${getTypeIcon(nType)}"></i> ${getTypeLabel(nType)}
            </span>
            <span class="notif-time" title="${escapeHtml(fullDate)}">
              <i class="bi bi-clock"></i> ${escapeHtml(ago)}
            </span>
            ${isUnread ? `<span class="notif-unread-badge"><i class="bi bi-dot"></i> New</span>` : ""}
          </div>
          <div class="notif-title">${escapeHtml(item.title)}</div>
          <div class="notif-message">${escapeHtml(item.message)}</div>
          ${metaHtml ? `<div class="notif-meta">${metaHtml}</div>` : ""}
          <div class="notif-actions">
            ${isMatch && job.title
              ? `<a class="btn-sm-primary" href="/jobs/?role=${encodeURIComponent(job.title)}">
                   <i class="bi bi-send"></i> Apply Now
                 </a>`
              : ""}
            ${isUnread
              ? `<button class="btn-sm-ghost" type="button" onclick="markRead(${item.id})">
                   <i class="bi bi-check2"></i> Mark Read
                 </button>`
              : `<span class="notif-read-status"><i class="bi bi-check2-all"></i> Read</span>`
            }
            <button class="btn-sm-danger-ghost" type="button" onclick="deleteNotification(${item.id})">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      </div>`;
  }

  // ===== API Actions =====
  async function markRead(id) {
    const btn = document.querySelector(`[onclick="markRead(${id})"]`);
    if (btn) {
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';
      btn.disabled = true;
    }
    await api(`/api/notifications/${id}/read/`, { method: "POST" });
    await loadNotifications(true);
    loadNotificationBell();
    updateLastUpdated();
  }

  async function markAllRead() {
    const btn = document.getElementById("markAllReadBtn");
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>'; }
    try {
      const result = await api("/api/notifications/mark-all-read/", { method: "POST" });
      if (result.marked_read > 0) showToast(`${result.marked_read} marked as read`, "success");
      await loadNotifications(true);
      loadNotificationBell();
      updateLastUpdated();
    } catch (e) {
      showToast(e.message, "danger");
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check2-all"></i> Mark All Read'; }
    }
  }

  async function deleteNotification(id) {
    if (!confirm("Delete this notification?")) return;
    const btn = document.querySelector(`[onclick="deleteNotification(${id})"]`);
    if (btn) {
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';
      btn.disabled = true;
    }
    try {
      await api(`/api/notifications/${id}/delete/`, { method: "DELETE" });
      await loadNotifications(true);
      loadNotificationBell();
      updateLastUpdated();
    } catch (e) {
      showToast(e.message, "danger");
    }
  }

  // ===== Filter & Pagination =====
  function applyFilterUI(filter) {
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === filter));
  }

  function setFilter(filter) {
    applyFilterUI(filter);
    currentPage = 1;
    if (window.SkillSyncState) window.SkillSyncState.save("notifications.view", { filter: filter });
    loadNotifications(true);
  }

  function changePage(delta) {
    if (!paginationData) return;
    const next = currentPage + delta;
    if (next < 1 || next > paginationData.total_pages) return;
    currentPage = next;
    loadNotifications(true);
  }

  // ===== Load Notifications =====
  async function loadNotifications(skipShimmer) {
    const listEl = document.getElementById("notificationsList");
    const paginationEl = document.getElementById("paginationBar");
    if (!skipShimmer) listEl.innerHTML = shimmerLoader(4);

    let url = `/api/notifications/?page=${currentPage}`;
    if (currentFilter === "unread") url += "&is_read=false";

    try {
      const data = await api(url);
      paginationData = data;

      const results = data.results || data;
      const total = data.count != null ? data.count : results.length;
      const unread = data.unread_count != null ? data.unread_count : results.filter(n => !n.is_read).length;
      const topPct = results.length ? Math.max(0, ...results.map(n => n.match_percentage || 0)) : 0;

      animateValue("totalNotifications", total);
      animateValue("unreadNotifications", unread);
      document.getElementById("topMatchNotification").textContent = topPct ? topPct + "%" : "–";

      const unreadBadge = document.getElementById("unreadBadge");
      const unreadText = document.getElementById("unreadBadgeText");
      if (unread > 0) {
        unreadBadge.style.removeProperty("display");
        unreadText.textContent = `${unread} unread`;
      } else {
        unreadBadge.style.setProperty("display", "none", "important");
      }

      listEl.innerHTML = results.length
        ? results.map(renderNotification).join("")
        : emptyState(
            "bell-slash",
            "No notifications yet",
            "Notifications from your activity will appear here."
          );

      if (data.count != null && data.total_pages > 1) {
        paginationEl.style.display = "flex";
        document.getElementById("prevPage").disabled = currentPage <= 1;
        document.getElementById("nextPage").disabled = currentPage >= data.total_pages;
        document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${data.total_pages}`;
      } else {
        paginationEl.style.display = "none";
      }

      const typesData = await api("/api/notifications/types/").catch(() => []);
      animateValue("typeCount", typesData.length || 0);
      updateLastUpdated();
    } catch (e) {
      listEl.innerHTML = emptyState("exclamation-triangle", "Error loading notifications", e.message);
      paginationEl.style.display = "none";
    }
  }

  // ===== Initial Load (restoring the last view) =====
  (function initNotificationsPage() {
    const store = window.SkillSyncState;
    if (!store) {
      loadNotifications();
      return;
    }

    let loaded = false;
    store.restore("notifications.view", (value, meta) => {
      const filter = (value && value.filter) || "all";
      if (filter !== currentFilter || !loaded) {
        applyFilterUI(filter);
        loaded = true;
        loadNotifications(meta.source === "remote");
      }
    });
  })();

  // ===== Auto-refresh =====
  setInterval(() => {
    if (typeof notificationWsConnected === "undefined" || !notificationWsConnected) {
      loadNotifications(true);
      loadNotificationBell();
    }
  }, 60000);
</script>
{% endblock %}
